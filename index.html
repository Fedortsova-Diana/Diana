    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background-color: #e8ddd0;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    .page-wrapper {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background-color: #faf5ee;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 48px rgba(0,0,0,0.13);
    }

    .top-section {
      position: relative;
      background: linear-gradient(145deg, #f7efe2 50%, #ede0c6 100%);
      padding: 24px 20px 26px;
    }

    /* ============================================================
       ГЕРОЙ: левая колонка + фото справа
    ============================================================ */
    .hero {
      display: flex;
      align-items: stretch;
      gap: 16px;
      margin-bottom: 24px;
    }

    .hero-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
    }

    /* ---- Весы + АДВОКАТ (центрированы относительно друг друга) ---- */
    .logo-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 14px;
      align-self: flex-start;
      width: 100%;
    }

    .scales-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .advokat-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #b8955a;
      font-size: 9px;
      font-family: Arial, sans-serif;
      letter-spacing: 2.5px;
      font-weight: 500;
    }
    .advokat-label::before,
    .advokat-label::after {
      content: '';
      display: block;
      width: 20px;
      height: 1px;
      background: #b8955a;
    }

    /* ---- Имя ---- */
    .name-last {
      font-size: 22px;
      font-weight: 700;
      color: #2c2416;
      line-height: 1.05;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .name-first {
      font-size: 17px;
      font-weight: 400;
      font-style: italic;
      color: #2c2416;
      line-height: 1.35;
      margin-top: 5px;
    }

    /* ---- Фото ---- */
    .photo-wrap {
      flex-shrink: 0;
      width: 128px;
      position: relative;
    }

    .photo-wrap img {
      width: 128px;
      height: 185px;
      object-fit: cover;
      object-position: top center;
      border-radius: 12px;
      display: block;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .photo-wrap::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 14px;
      border: 1.5px solid rgba(184,149,90,0.4);
      pointer-events: none;
      z-index: 1;
    }

    /* ============================================================
       КОНТАКТЫ
    ============================================================ */
    .contacts {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #2c2416;
      transition: opacity .2s;
    }
    .contact-item:hover { opacity: .7; }

    .contact-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #b8955a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .contact-icon svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    .contact-text {
      font-size: 13.5px;
      font-family: Arial, sans-serif;
      color: #3a2e1e;
      line-height: 1.4;
    }
    .contact-text small {
      display: block;
      font-size: 11px;
      color: #8a7a60;
      margin-top: 1px;
    }

    .contact-divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(184,149,90,0.3), transparent);
      margin: 2px 0;
    }

    /* ============================================================
       ДЕСКТОП
    ============================================================ */
    @media (min-width: 768px) {
      body {
        padding: 0;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        min-height: 100vh;
        background: linear-gradient(135deg, #e8ddd0 0%, #d5c4ae 100%);
      }
      .page-wrapper {
        grid-column: 2;
        align-items: center;
        justify-content: center;
        padding: 48px 0;
      }
      .card {
        max-width: 480px;

      .photo-wrap     { width: 145px; }
      .photo-wrap img { width: 145px; height: 205px; }

    }

    @media (max-width: 360px) {

      .photo-wrap     { width: 108px; }

      .contact-text   { font-size: 12px; }
    }
  </style>
